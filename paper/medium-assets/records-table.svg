<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="512" viewBox="0 0 1200 512" font-family="Liberation Serif, DejaVu Serif, Georgia, serif">
  <rect width="1200" height="512" fill="#F4F5F2"/>
  <rect x="0" y="0" width="1200" height="6" fill="#8C2F39"/>

  <text x="60" y="78" font-size="34" font-weight="600" fill="#182230">Record computations of Khinchin&#8217;s constant</text>

